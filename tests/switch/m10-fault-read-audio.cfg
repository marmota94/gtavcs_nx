# M10-09: I/O failures in the radio's music stream while driving (the car's radio plays AUDIO/MUSIC/*.VB): from
# 120 s the next 5 reads of a .VB file fail (VCS_NX_FAULT_READ). Expected: the failures logged, the sound going on
# (a gap at most), no crash or hang, audio underruns counted. Nobody touches the console.
profile m10-fault-read-audio
env VCS_NX_FAULT_READ=.VB:120:5
env PS2X_AUDIO_STATS=1
env PS2X_RHI_STATS=1
env PS2X_PERF_LOG=userdata/tests/m10-fault-read-audio/perf.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 300
report 10
every 4 10 26 press cross
at 32 scm b101cfa5070107010701070107019b00cfa52300
at 34 scm 600108d3002802480008d30009cd44c9c4097b5404c309c3f57c410d4e000d09cd44c9c4097b5404c3090000c8c21c02cfa50db2010d07010701070107010701620108d3002300
at 44 cruise start userdata/m06-city.txt 40 loop
every 30 60 280 cruise status
every 30 60 280 player
every 60 60 280 gameinfo
at 290 perf
