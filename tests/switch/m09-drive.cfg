# M09-07: the frame edges at 16:9 while driving. m06-drive.cfg's car on upstream's city route (userdata/m06-city.txt,
# ~5.7 km over the busiest cells on both sides of the bay) at 40 m/s, so new cells stream in all the time; a 1280x720
# screenshot every 15 s to look at the outer eighths of the picture (beyond 4:3: buildings, traffic, peds, terrain), the
# player's place with each. Nobody touches the console.
profile m09-drive
env PS2X_RHI_STATS=1
env PS2X_CAPTURE_SIZE=1280x720
seconds 420
report 10
every 4 10 26 press cross
at 32 scm b101cfa5070107010701070107019b00cfa52300
at 34 scm 600108d3002802480008d30009cd44c9c4097b5404c309c3f57c410d4e000d09cd44c9c4097b5404c3090000c8c21c02cfa50db2010d07010701070107010701620108d3002300
at 44 cruise start userdata/m06-city.txt 40 loop
every 60 60 400 cruise status
every 15 60 405 player
