# M10-03 diagnosis (A/B): the docked 16:9 picture with its wide targets 896 wide instead of 853 (PS2X_HW_WIDE_ALIGN=64,
# patch 0014) against m10-stand-passes.cfg. The same start, the player standing at the S4 spot at 16:9 for 80-280 s.
# GPU time per pass, threads and conditions on the report lines. Also a sampling profile of the game thread (t4: the
# busiest created thread in threads-docked; src/switch/sampler.c) over 80-280 s at 500 Hz. Diagnosis only. Nobody
# touches the console.
profile m10-stand-align64
env PS2X_HW_WIDE_ALIGN=64
env VCS_NX_SAMPLE_THREAD=4
env VCS_NX_SAMPLE_HZ=500
env VCS_NX_SAMPLE_FROM=80
env VCS_NX_SAMPLE_TO=280
env VCS_NX_SAMPLE_OUT=userdata/tests/m10-stand-align64/samples.txt
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_PASS_TIME=1
env PS2X_GL_GPU_LOG=userdata/tests/m10-stand-align64/gpu.csv
env PS2X_PERF_LOG=userdata/tests/m10-stand-align64/perf.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 300
report 10
every 4 10 70 press cross
every 30 30 270 gameinfo
at 125 screenshot userdata/tests/m10-stand-align64/s4-169-125.png
at 225 screenshot userdata/tests/m10-stand-align64/s4-169-225.png
at 285 perf
