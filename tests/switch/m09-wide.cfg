# M09: 16:9 from an empty test card through S1-S4 (m06-route.cfg's Cross schedule), nobody touches the console.
# The Hor+ view window (0x742AC0: tan(FOV / 2) x r, aspect x r, near, far) and CCamera's entity side planes
# (TheCamera 0x6F44D0 + 0xB60 right, + 0xB70 left) read in S2, S3 and S4 (M09-02); the three HUD modes, 4:3 and back,
# the pause menu in and out with every presented frame captured (burst), the cutscene bars off in S3, and the
# sniper scope / camera mask at 16:9 (M09-03 to M09-05). GPU time and the RHI's resources logged (M09-06).
profile m09-wide
env VCS_ASPECT=169
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_GPU_LOG=userdata/tests/m09-wide/gpu.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 230
report 10
every 4 10 70 press cross
every 5 5 225 gameinfo
# S2 flyover
at 20 peekf 0x742ac0 4
at 20 peekf 0x6f5030 2
at 20 peekf 0x6f5040 2
at 21 screenshot userdata/tests/m09-wide/s2-020.png
# S3 cutscene: bars on (default), then off, then on again
at 40 screenshot userdata/tests/m09-wide/s3-040-bars.png
