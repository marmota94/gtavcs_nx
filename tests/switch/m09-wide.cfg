at 40 peekf 0x6f5030 2
at 40 peekf 0x6f5040 2
at 41 setting display.cutscene_bars 0
at 43 screenshot userdata/tests/m09-wide/s3-043-nobars.png
at 44 setting display.cutscene_bars 1
# S4 play
at 85 peekf 0x742ac0 4
