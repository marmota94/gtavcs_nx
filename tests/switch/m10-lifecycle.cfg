# M10-08: docking / undocking, HOME, sleep and wake, controller loss and an orderly exit under heavy streaming,
# audio and GPU work (docked first: SCOPE_DECISIONS.md). m10-route.cfg's start, car and cruise over the city cells
# (streaming), then the person, from the TV, with the times counted from the moment the game's first picture shows
# (the session prints the send time; the log's report lines carry t):
#   ~120 s  HOME, wait ~10 s on the HOME menu, back into the game
#   ~180 s  POWER (sleep), wait ~20 s, wake (POWER), back into the game
#   ~240 s  take the console out of the dock (handheld), ~20 s, put it back (docked)
#   ~300 s  disconnect the controllers (HOME > Controllers > Change Grip/Order, which disconnects them), ~15 s,
#           reconnect (press L+R), back into the game
#   ~360 s  undock again, ~20 s, dock
#   then nothing until the end (600 s): the game ends itself (the orderly exit).
# What the log shows: focus out / in and confirmed suspension ([lifecycle], [platform] focus), the output mode at each
# dock change ([video] output 1280x720 / 1920x1080, the crop), the controller's state ([platform] controller ...,
# gamepad=), the heap at every report, the frame times (perf.csv), GL errors, audio underruns.
profile m10-lifecycle
env PS2X_RHI_STATS=1
env PS2X_PERF_LOG=userdata/tests/m10-lifecycle/perf.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 600
report 5
every 4 10 26 press cross
at 32 scm b101cfa5070107010701070107019b00cfa52300
at 34 scm 600108d3002802480008d30009cd44c9c4097b5404c309c3f57c410d4e000d09cd44c9c4097b5404c3090000c8c21c02cfa50db2010d07010701070107010701620108d3002300
at 44 cruise start userdata/m06-city.txt 40 loop
every 30 60 580 cruise status
every 30 60 580 gameinfo
at 590 perf
