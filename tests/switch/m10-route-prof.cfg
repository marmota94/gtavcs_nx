# M10-01 / M10-04: the standard busy route. m09-drive.cfg's start (Cross every 4 s skips S2 / S3 to the S4 spot at
# Fort Baxter; at 32-34 s upstream's rig script makes car 211, warps the player into it, both proof against damage),
# then from 44 s the rig's cruise moves the car along upstream's city route (gamefolder/userdata/m06-city.txt, ~5.7 km
# over the busiest cells on both sides of the bay) at 40 m/s in a loop, so new cells stream in all the time.
# Measured window: 90-390 s (perf.csv t_s; warmup 0-90 s: boot, movies, S2-S4, the car, the first streaming).
# Defaults: 16:9, internal scale 1x, stock clocks; the mode (handheld / docked) is the console's at launch and is in
# the log's [video] output line. Game frames (perf.csv), GL_TIME_ELAPSED per presented frame (gpu.csv), the RHI's
# objects / targets and the heap every 10 s ([rhi-stats], progress), the cruise distance every 60 s.
# m10-route-prof: the same route with a sampling profile of the game thread (t4) and the GS stage (t6) over the
# window (src/switch/sampler.c; VCS_NX_SAMPLE_*) and the main thread's CPU time in the GL backend by kind of call
# (PS2X_GL_CPU_TIME), so the numbers are not the baseline (pauses and timers cost a little).
# Nobody touches the console; auto-sleep off.
profile m10-route-prof
env VCS_NX_SAMPLE_THREAD=4,6
env VCS_NX_SAMPLE_HZ=500
env VCS_NX_SAMPLE_FROM=90
env VCS_NX_SAMPLE_TO=390
env VCS_NX_SAMPLE_OUT=userdata/tests/m10-route-prof/samples.txt
env PS2X_RHI_STATS=1
env PS2X_GL_CPU_TIME=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_GPU_LOG=userdata/tests/m10-route-prof/gpu.csv
env PS2X_PERF_LOG=userdata/tests/m10-route-prof/perf.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 420
report 10
every 4 10 26 press cross
at 32 scm b101cfa5070107010701070107019b00cfa52300
at 34 scm 600108d3002802480008d30009cd44c9c4097b5404c309c3f57c410d4e000d09cd44c9c4097b5404c3090000c8c21c02cfa50db2010d07010701070107010701620108d3002300
at 44 cruise start userdata/m06-city.txt 40 loop
every 60 60 400 cruise status
every 30 60 390 player
every 60 30 390 gameinfo
at 120 screenshot userdata/tests/m10-route-prof/route-120.png
at 240 screenshot userdata/tests/m10-route-prof/route-240.png
at 360 screenshot userdata/tests/m10-route-prof/route-360.png
at 395 perf
