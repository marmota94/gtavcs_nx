# M09-06 diagnosis: m09-cost-169.cfg with PS2X_HW_WIDE_SCALE=0 (the picture's targets at 640 x 448, stretched to 16:9).
# M09-06: the cost of widescreen against 4:3 at the same internal scale (1x): m06-route.cfg's Cross schedule to S4 at
# Fort Baxter, then the player standing at the S4 spot for 150 s at display.aspect 169. GL_TIME_ELAPSED per frame
# (PS2X_GL_GPU_TIME, gpu.csv), the RHI's textures / render targets (largest live target) and the heap every 10 s, the
# perf lines and frame times (perf.csv); the view window and entity planes at 150 and 190 s (M09-02, for the
# desktop reference's same schedule). Run once at 43 and once at 169 (169 then gives a gun and a camera
# for the scope / camera masks after the measured window, upstream's regress step "scopemask"); nobody touches the console.
profile m09-cost-169n
env VCS_ASPECT=169
env PS2X_HW_WIDE_SCALE=0
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_GPU_LOG=userdata/tests/m09-cost-169n/gpu.csv
env PS2X_PERF_LOG=userdata/tests/m09-cost-169n/perf.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 240
report 10
every 4 10 70 press cross
every 10 10 230 gameinfo
at 150 peekf 0x742ac0 4
at 150 peekf 0x6f5030 2
at 150 peekf 0x6f5040 2
at 190 peekf 0x742ac0 4
at 190 peekf 0x6f5030 2
at 190 peekf 0x6f5040 2
at 200 screenshot userdata/tests/m09-cost-169n/s4-200.png
at 205 perf
