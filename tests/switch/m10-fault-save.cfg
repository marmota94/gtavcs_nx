# M10-09: a save interrupted like a power cut. On an empty test card the game saves to slot 1 at 90 s through its own
# memory card code (upstream's VCS_TEST_SAVE, as m04-save.cfg); after 60000 bytes have gone into the card's files the
# process ends at once (VCS_NX_FAULT_SAVE_BYTES: the write that crosses it stops there, no flush or close, the log's
# "[fault] save cut" line). The next start on the same card (m10-fault-save-after.cfg, --keep-card) shows what the
# card and the game make of the cut save. Nobody touches the console.
profile m10-fault-save
env VCS_SKIP_MOVIES=1
env VCS_TEST_SAVE=90
env VCS_NX_FAULT_SAVE_BYTES=60000
seconds 140
report 5
every 4 10 70 press cross
every 10 5 135 player
at 135 gameinfo
