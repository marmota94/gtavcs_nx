# M10-09: I/O failures in the world archives while driving. m10-route.cfg's start, car and cruise (streaming), and
# from 150 s the next 3 reads of MAINLA.IMG / BEACH.IMG fail as an I/O error would (VCS_NX_FAULT_READ, src/vfs:
# nothing read, the "[folder-disc] read failed" and "[fault] read n of 3 refused" lines). Expected: the failures
