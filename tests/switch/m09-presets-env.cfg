# M09 review 1, finding 4: a preset with Aspect ratio locked by its environment variable (VCS_ASPECT=43, the menu
# shows it read-only). settings::set refuses the locked key, and patch 0013's fallback must leave it alone: Enhanced and
# Widescreen, light ask for Match window (0) and the aspect stays 4:3, with no "not offered here" line. Cross to S4,
# each preset pressed through the control channel, the aspect read back after each. Nobody touches the console.
profile m09-presets-env
env PS2X_CAPTURE_SIZE=1280x720
env VCS_ASPECT=43
seconds 130
report 10
every 4 10 70 press cross
every 10 10 120 gameinfo
at 90 setting display.aspect
at 93 setting presets.enhanced 1
at 96 setting display.aspect
at 97 screenshot userdata/tests/m09-presets-env/enhanced.png
at 100 setting presets.light 1
at 103 setting display.aspect
at 104 screenshot userdata/tests/m09-presets-env/light.png
at 107 setting presets.authentic 1
at 110 setting display.aspect
at 120 perf
