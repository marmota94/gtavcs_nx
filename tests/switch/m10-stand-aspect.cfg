# M10-03 diagnosis: what the wide picture costs docked. m09-cost-169.cfg's start (Cross every 4 s to S4 at Fort
# Baxter), then the player standing at the S4 spot (no streaming; M09-06's handheld numbers are the same view) while
# the aspect is switched live every 50 s: 16:9 (default) 80-130 s, 4:3 130-180 s, 16:9 180-230 s, 4:3 230-280 s.
# perf.csv / gpu.csv / [rhi-stats] targets as M09-06. Nobody touches the console.
profile m10-stand-aspect
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_GPU_LOG=userdata/tests/m10-stand-aspect/gpu.csv
env PS2X_PERF_LOG=userdata/tests/m10-stand-aspect/perf.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 300
report 10
every 4 10 70 press cross
every 30 30 270 gameinfo
at 125 screenshot userdata/tests/m10-stand-aspect/s4-169-125.png
at 130 setting display.aspect 43
at 175 screenshot userdata/tests/m10-stand-aspect/s4-43-175.png
at 180 setting display.aspect 169
at 225 screenshot userdata/tests/m10-stand-aspect/s4-169-225.png
at 230 setting display.aspect 43
at 275 screenshot userdata/tests/m10-stand-aspect/s4-43-275.png
at 285 perf
at 290 setting display.aspect 169
