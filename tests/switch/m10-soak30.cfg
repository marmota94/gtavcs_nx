# M10-07: the 30-minute continuous gameplay soak (docked first: SCOPE_DECISIONS.md), from an empty test card:
# Cross every 4 s to S4 (the first mission, "Soldier", running), then combat on foot (R1 = mouseright holds the
# lock-on on the nearest soldier, Circle = mouseleft attacks, 80-110 s), then the player proof against damage and in
# car 211 (m06-drive's rig scripts), the rig's cruise along upstream's city route at 40 m/s (streaming), and five
# interior transitions: every 300 s from 420 s the cruise stops, the player (in his car) goes into Phil's range
# interior (area 2 at (-685.31, -1550.65, 30), game-internals.md; rig.Scm SET_AREA_VISIBLE + LOAD_SCENE +
# SET_CHAR_COORDINATES) for 40 s, back outdoors at the S4 spot (area 0, z -100 = the ground), into a new car 211 (the
# teleport leaves the old one behind: soak30-docked-4's cruise had no car after the first transition) and the cruise
# starts again. Gameplay from ~80 s to 1890 s (30+ minutes). Heap / threads / conditions every 10 s, frame times (perf.csv),
# GPU time (gpu.csv), the player every 30 s, the camera / area every 60 s. M06-12's open points over the soak:
# heap_obtained's growth after heap_in_use levels off, and patch 0009's prune age. Nobody touches the console;
# auto-sleep off.
profile m10-soak30
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_GPU_LOG=userdata/tests/m10-soak30/gpu.csv
env PS2X_PERF_LOG=userdata/tests/m10-soak30/perf.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 1920
report 10
