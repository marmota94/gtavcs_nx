# M09-08 / M09-01, the person at the Switch (handheld, paired Joy-Cons attached): Cross every 4 s to 70 s skips S2 / S3
# to the S4 spot at Fort Baxter; then, in play, the person opens the developer menu (L3 + R3) > Settings > Display >
# Aspect ratio and switches 4:3 -> 16:9 -> 4:3 -> 16:9 -> 4:3, looking at the picture each time, leaves it at 4:3,
# closes the menus and closes the game from HOME. A screenshot every 10 s from 80 s, gameinfo (camera mode) every 5 s.
# m09-relaunch.cfg then starts again on the same card: the 4:3 chosen here must load.
profile m09-accept
env PS2X_RHI_STATS=1
env PS2X_CAPTURE_SIZE=1280x720
seconds 600
report 10
every 4 10 70 press cross
every 5 5 595 gameinfo
