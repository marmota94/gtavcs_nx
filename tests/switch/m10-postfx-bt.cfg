# M10-03 diagnosis (A/B): which of the native post effects carries the docked 16:9 picture passes' cost.
# PS2X_HW_POSTFX=bt (b bloom, t trails, c frame copies / motion blur run natively; the others as the game's recorded
# GS draws; 0 = all recorded; default btc). Cross every 4 s to S4 at Fort Baxter, the player standing at the S4 spot
# at 16:9; measured window 70-130 s. GPU time per pass, threads and conditions on the report lines. Diagnosis only.
# Nobody touches the console.
profile m10-postfx-bt
env PS2X_HW_POSTFX=bt
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_PASS_TIME=1
env PS2X_PERF_LOG=userdata/tests/m10-postfx-bt/perf.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 140
report 10
every 4 10 70 press cross
every 30 30 120 gameinfo
at 100 screenshot userdata/tests/m10-postfx-bt/s4-100.png
at 135 perf
