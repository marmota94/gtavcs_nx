# M09-01: the Display presets with the Switch's narrowed Aspect ratio (root patch 0013). Cross to S4, then each preset
# button pressed through the control channel (`setting <key> 1` presses an Action): Enhanced and Widescreen, light ask
# for Match window (0), which the Switch does not offer, and get its default 16:9 instead; Authentic (PS2) sets 4:3.
# The aspect is read back after each, with a screenshot. Nobody touches the console.
profile m09-presets
env PS2X_CAPTURE_SIZE=1280x720
seconds 150
report 10
every 4 10 70 press cross
every 10 10 140 gameinfo
at 90 setting display.aspect 43
at 93 setting presets.enhanced 1
at 96 setting display.aspect
at 97 screenshot userdata/tests/m09-presets/enhanced.png
at 100 setting presets.authentic 1
at 103 setting display.aspect
at 104 screenshot userdata/tests/m09-presets/authentic.png
at 107 setting presets.light 1
at 110 setting display.aspect
at 111 screenshot userdata/tests/m09-presets/light.png
at 114 setting presets.authentic 1
at 140 perf
