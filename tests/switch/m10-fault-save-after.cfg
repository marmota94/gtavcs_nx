# M10-09: the start after the interrupted save (m10-fault-save.cfg), on the same test card (--keep-card): the card is
# read at boot and at the first save menu the game shows; then the game saves to slot 1 again at 90 s (no fault) - the
# recovery: a whole save written over the cut one. The log's [MC] lines (the card's files, the backups made before each
# change) and the card's files read back after the run. Nobody touches the console.
profile m10-fault-save
env VCS_SKIP_MOVIES=1
env VCS_TEST_SAVE=90
seconds 140
report 5
every 4 10 70 press cross
every 10 5 135 player
at 135 gameinfo
