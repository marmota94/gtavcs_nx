env PS2X_PERF_LOG=userdata/tests/m10-stand-wide0/perf.csv
env PS2X_CAPTURE_SIZE=1280x720
seconds 300
report 10
every 4 10 70 press cross
every 30 30 270 gameinfo
at 125 screenshot userdata/tests/m10-stand-wide0/s4-169-125.png
at 225 screenshot userdata/tests/m10-stand-wide0/s4-169-225.png
at 285 perf
