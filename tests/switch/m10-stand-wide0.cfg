# M10-03 diagnosis (A/B): the docked 16:9 picture with every target at the plain 1x scale (PS2X_HW_WIDE_SCALE=0:
# 640-wide targets stretched to 16:9) against m10-stand-passes.cfg's 853-wide ones. The same start (Cross every 4 s to
# S4 at Fort Baxter), the player standing at the S4 spot at 16:9 for the whole window 80-280 s. GPU time per pass,
# threads and clocks on the report lines. Diagnosis only: not a player setting. Nobody touches the console.
profile m10-stand-wide0
env PS2X_HW_WIDE_SCALE=0
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_PASS_TIME=1
