# M09: the Switch default (16:9, no VCS_ASPECT: the setting stays live) from an empty test card with no input, so the
# game's own S3 cutscene runs (Cross skips it). Stages measured on the candidate NRO (run silent, the boot movies play
# since M07): S1 movies / menus to ~95 s, S2 flyover (camera mode 15) ~100-175 s, S3 cutscene (mode 17) from ~180 s
# past 325 s (M06's silent run: about 135 s of cutscene), S4 expected from ~330 s. Nobody touches the console.
# - Hor+ view window (0x742AC0: tan(FOV / 2) x r, aspect x r, near, far) and CCamera's entity side planes (TheCamera
#   0x6F44D0 + 0xB60 right, + 0xB70 left) in S2, S3 and S4, at 16:9 and after a live switch to 4:3 (M09-02)
# - the loading screen before S2 (a 2D-only frame: 4:3 inside the 16:9 frame) and the pause menu in S4 (M09-04)
# - the cutscene bars on / off / on in S3, and at 4:3 (locked on) (M09-05)
# - the three HUD modes in S4, live 4:3 and back to 16:9 (M09-01, M09-03)
# - the sniper scope and the camera mask at 16:9 in S4 (M09-05)
profile m09-silent
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_CAPTURE_SIZE=1280x720
seconds 470
report 10
every 5 5 465 gameinfo
