# M09-01: the aspect ratio chosen in the developer menu (m09-accept.cfg, left at 4:3) loads at the next start on the same
# card (run with --keep-card): the boot log lists display.aspect=43 as not at its default and the picture is 4:3; then
# `setting display.aspect 169` puts the default back (the file's line rewritten), read again by a third start if wanted.
# Nobody touches the console.
profile m09-accept
env PS2X_CAPTURE_SIZE=1280x720
seconds 120
report 10
every 4 10 70 press cross
every 10 10 110 gameinfo
at 90 screenshot userdata/tests/m09-accept/relaunch-090.png
at 95 setting display.aspect 169
at 100 screenshot userdata/tests/m09-accept/relaunch-100.png
at 115 perf
