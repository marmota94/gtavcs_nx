name: Switch game core build
on:
  push:
    branches: [main, 'milestone/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Public sources only: the runtime, game layer, SDL2 platform and core adapter compile in the locked container.
      # The game NRO needs the user's generated code and is built privately (tools/build_game.py), never here.
      - run: python tools/build_game.py --public --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-core-build-logs-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: build/evidence/M04/build/public*.log
